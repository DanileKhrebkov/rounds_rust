[package]
name = "rounds_white"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_sprite",         # Sprite (players, projectiles)
    "bevy_text",           # HUD text (Step 2+)
    "bevy_ui",             # UI layout for HUD
    "bevy_render",         # renderer core
    "bevy_core_pipeline",  # Camera2dPlugin + 2D render graph — БЕЗ ЭТОГО ОКНО СЕРОЕ
    "multi_threaded",
    "x11",                 # Linux windowing (в sandbox/CI нет Wayland)
] }
rand = "0.10"

# Bevy огромен; в debug-сборке без оптимизаций зависимостей будет статтеринг.
# `opt-level = 1` для зависимостей — стандартный компромисс, наш код остаётся на 0.
# `debug = false` — потому что ~2 GB RAM без swap: `-C debuginfo=2` даёт OOM
# (SIGKILL) при компиляции bevy_render. Верните `debug = 1` локально, если нужны
# номера строк в стек-трейсах.
[profile.dev]
opt-level = 0
debug = false

[profile.dev.package."*"]
opt-level = 1